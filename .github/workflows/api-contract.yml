name: API Contract Tests (Newman)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  newman:
    name: Postman / Newman
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write CI environment file
        # Injects GitHub Secrets into a temporary Postman environment
        # The committed environment file has REPLACE_WITH_* placeholders — never real values
        run: |
          cat > postman/ci-environment.json <<EOF
          {
            "id": "ccou-sf-ci-env",
            "name": "CCO United — Salesforce (CI)",
            "_postman_variable_scope": "environment",
            "values": [
              { "key": "sf_login_url",      "value": "https://login.salesforce.com", "enabled": true },
              { "key": "sf_instance_url",   "value": "${{ secrets.SF_INSTANCE_URL }}", "enabled": true },
              { "key": "sf_client_id",      "value": "${{ secrets.SF_CLIENT_ID }}",     "enabled": true },
              { "key": "sf_client_secret",  "value": "${{ secrets.SF_CLIENT_SECRET }}", "enabled": true },
              { "key": "sf_username",       "value": "${{ secrets.SF_USERNAME }}",       "enabled": true },
              { "key": "sf_password",       "value": "${{ secrets.SF_PASSWORD }}",       "enabled": true },
              { "key": "sf_security_token", "value": "${{ secrets.SF_SECURITY_TOKEN }}", "enabled": true },
              { "key": "monday_board_id",   "value": "18415645308",                  "enabled": true },
              { "key": "monday_item_id",    "value": "",                             "enabled": true }
            ]
          }
          EOF

      - name: Run Newman API contract tests
        id: newman
        run: |
          npx newman run postman/CCOUnited_SF_Integration.postman_collection.json \
            --environment postman/ci-environment.json \
            --reporters cli,json \
            --reporter-json-export test-results/newman-results.json \
            --bail && echo "NEWMAN_RESULT=pass" >> "$GITHUB_ENV" \
                   || echo "NEWMAN_RESULT=fail" >> "$GITHUB_ENV"

      - name: Sync Jira QA status (Newman)
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SCOPE: newman
        run: |
          mkdir -p public
          echo '{"suites":[]}' > public/test-summary.json
          NEWMAN_STATUS="${NEWMAN_RESULT}" node scripts/jira-sync-from-summary.mjs

      - name: Append test history (Newman)
        if: always()
        run: |
          # Count pass/fail from newman-results.json if it exists
          if [ -f test-results/newman-results.json ]; then
            PASS=$(node -e "const r=require('./test-results/newman-results.json');const s=r.run?.stats?.assertions;console.log(s?.total-s?.failed||0)")
            FAIL=$(node -e "const r=require('./test-results/newman-results.json');const s=r.run?.stats?.assertions;console.log(s?.failed||0)")
          else
            PASS=0; FAIL=11
          fi
          HISTORY_LANE=newman HISTORY_PASS="$PASS" HISTORY_FAIL="$FAIL" node scripts/append-test-history.mjs

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: test-results/newman-results.json
          retention-days: 14
