name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Write permission needed to commit test-summary.json back to the repo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN — fetch full history so we can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Generate test summary
        if: always()
        run: node scripts/summarize-tests.mjs

      - name: Sync Jira QA status (Playwright suites)
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SCOPE: playwright
        run: node scripts/jira-sync-from-summary.mjs

      - name: Append test history
        if: always()
        run: |
          PASS=$(node -e "const s=require('./public/test-summary.json');const pw=s.suites.filter(x=>x.suite.startsWith('Playwright'));console.log(pw.reduce((a,x)=>a+(x.pass||0),0))")
          FAIL=$(node -e "const s=require('./public/test-summary.json');const pw=s.suites.filter(x=>x.suite.startsWith('Playwright'));console.log(pw.reduce((a,x)=>a+(x.fail||0),0))")
          HISTORY_LANE=playwright HISTORY_PASS="$PASS" HISTORY_FAIL="$FAIL" node scripts/append-test-history.mjs

      - name: Commit test-summary.json and test-history.json
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/test-summary.json public/test-history.json
          git diff --cached --quiet || git commit -m "ci: update test-summary + history [skip ci]"
          git push

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
